# 태그를 밀면 릴리스를 만든다.
#
# 태그를 만드는 쪽은 사람이고, 태그를 산출물로 바꾸는 쪽은 scripts/release.sh
# 하나다 — 로컬에서 돌리든 여기서 돌리든 같은 경로를 지난다. 이 파일이 하는
# 일은 그 스크립트가 필요로 하는 두 개의 키를 러너에 잠깐 들여놓고, 끝나면
# 치우는 것뿐이다.
name: Release

on:
  push:
    tags:
      - 'v*'
  # 태그 없이 돌려보고 싶을 때. 발행하지 않고 만들기만 한다.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: salaryclock-release
  cancel-in-progress: false

jobs:
  release:
    # macOS 26이어야 한다. 아이콘의 밝게/어둡게 두 벌을 컴파일하는 건
    # Xcode 26의 actool부터 되는데, 그 아래 러너에서는 다크 변형이 조용히
    # 빠지거나 컴파일이 거부된다.
    runs-on: macos-26
    env:
      CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      # 로컬에서는 iCloud를 피해 캐시에 조립하지만(bundle-app.sh) 러너에는
      # iCloud가 없다. 작업 공간에 두면 산출물을 집어 올리기 쉽다.
      BUILD_DIR: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4
        with:
          # release.sh가 태그와 HEAD가 같은 커밋인지 본다. 얕게 받으면 태그를
          # 못 찾는다.
          fetch-depth: 0

      - name: 서명 신원을 임시 키체인에 들인다
        run: |
          set -euxo pipefail
          echo "--- 단계 시작"
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SPARKLE_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || { echo "시크릿이 비어 있다: $name" >&2; exit 1; }
          done

          # 러너의 기본 키체인을 건드리지 않고 임시 키체인을 하나 만들어 쓴다.
          KEYCHAIN="$RUNNER_TEMP/salaryclock.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          P12="$RUNNER_TEMP/signing.p12"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$P12"

          echo "ORIGINAL_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          # 이게 없으면 codesign이 키를 쓸 때마다 GUI 승인을 기다리다 멈춘다.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # 자체 서명이라 신뢰 설정을 붙여야 한다. security find-identity -v는
          # "유효한" 신원만 내놓는데, 신뢰 설정이 없으면 이 인증서가 그 목록에서
          # 빠지고 bundle-app.sh가 신원이 없다며 멈춘다. 로컬에서는
          # create-signing-certificate.sh가 같은 일을 한다.
          CERT="$RUNNER_TEMP/signing.pem"
          openssl pkcs12 -in "$P12" -passin pass:"$CERTIFICATE_PASSWORD" \
            -clcerts -nokeys -out "$CERT"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CERT"
          rm -f "$P12" "$CERT"

          security find-identity -v -p codesigning | grep -F '"SalaryClock"'

      - name: 테스트
        run: |
          set -euo pipefail
          swift test --package-path macos/SalaryClockCore
          swift test --package-path macos/SalaryClockApp

      - name: 빌드하고 발행한다
        run: |
          set -euo pipefail
          # 태그가 밀려서 돌아온 경우에만 발행한다. 손으로 돌린 경우(workflow_dispatch)는
          # 만들기만 하고 멈춘다 — 워크플로를 고친 뒤 확인해 보는 용도다.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./scripts/release.sh --publish --skip-tag
          else
            ./scripts/release.sh
          fi

      - name: 만든 것을 남긴다
        uses: actions/upload-artifact@v4
        with:
          name: salaryclock-release
          if-no-files-found: error
          path: |
            build/*.dmg
            build/appcast.xml

      - name: 임시 키체인을 치운다
        if: always()
        run: |
          set +e
          [[ -n "${ORIGINAL_KEYCHAINS:-}" ]] && security list-keychains -d user -s $ORIGINAL_KEYCHAINS
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN"
          exit 0
